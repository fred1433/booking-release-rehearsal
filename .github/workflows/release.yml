# Release path for the booking app, as used in the recorded run on 14 October 2026.
# - Every push to main was tested, then deployed to staging (no approval).
# - The production job used the protected "production" environment: a required reviewer had to approve
#   that exact run, and the run is pinned to one commit, so approving it cannot release another commit.
# - What this did NOT do: confine every production-capable credential to that job. The staging job
#   held the same account-wide Cloudflare token without a reviewer, so it could have deployed production.
#   A real setup needs a staging credential that cannot touch production resources.
# - Rollback = run this workflow by hand with an older commit; it goes through the same gate.
#   The app is checked out from the release commit into rel/, but the deploy and smoke scripts
#   come from the workflow's own commit: rolling back the app must not roll back the tooling.
# - After the run the deploy secrets were removed, and the push trigger is off: this workflow now runs
#   only by hand and will fail without secrets. Later demo builds were deployed locally (see README).
name: release
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to release (full SHA, must already be on main). Empty = the commit this run starts from."
        required: false
permissions:
  contents: read
concurrency:
  group: release-production
  cancel-in-progress: false
env:
  WRANGLER: wrangler@4.146.0
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        run: |
          SHA="${{ github.event.inputs.commit }}"
          [ -z "$SHA" ] && SHA="${{ github.sha }}"
          git cat-file -e "$SHA^{commit}"
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          echo "sha=$(git rev-parse "$SHA")" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $(git rev-parse "$SHA")" >> "$GITHUB_STEP_SUMMARY"
  test:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm test
        working-directory: app
  staging:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://theaipipe.com/demos/paperclip-booking-rehearsal/staging/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}", path: rel }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Migrate and deploy staging
        working-directory: rel/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y $WRANGLER d1 migrations apply DB --env staging --remote
          npx -y $WRANGLER deploy --env staging --var GIT_SHA:${{ needs.resolve.outputs.sha }} --var DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)
      - name: Smoke test staging
        run: ./scripts/smoke.sh https://theaipipe.com/demos/paperclip-booking-rehearsal/staging ${{ needs.resolve.outputs.sha }}
  production:
    needs: [resolve, staging]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://theaipipe.com/demos/paperclip-booking-rehearsal/app/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.resolve.outputs.sha }}", path: rel }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Confirm the approved run releases the tested commit
        run: test "$(git -C rel rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
      - name: Migrate and deploy production
        working-directory: rel/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx -y $WRANGLER d1 migrations apply DB --env production --remote
          npx -y $WRANGLER deploy --env production --var GIT_SHA:${{ needs.resolve.outputs.sha }} --var DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)
      - name: Smoke test production
        run: ./scripts/smoke.sh https://theaipipe.com/demos/paperclip-booking-rehearsal/app ${{ needs.resolve.outputs.sha }}
